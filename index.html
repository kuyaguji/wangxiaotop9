<html lang="zh-CN">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      background: #F7F3EC;
      color: #4F3A2A;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
    }
    body { min-height: 100vh; }
    .screen { display: none; width: 100%; min-height: 100vh; }
    .screen.active { display: flex; }

    /* 顶部小游戏标题栏 */
    .game-bar {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .game-logo {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #3E2C1F;
    }
    .game-tag {
      font-size: 11px;
      color: #7A6555;
      background: #EDE6DA;
      border: 1px solid #E7DDCB;
      border-radius: 999px;
      padding: 4px 10px;
      letter-spacing: 0.12em;
    }

    /* 首页：极简封面 */
    #start-screen {
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
    }
    .start-content {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .cover-card {
      background: #FBF8F2;
      border: 1px solid #EFE6D4;
      border-radius: 28px;
      padding: 48px 22px;
      box-shadow: 0 18px 40px rgba(120, 91, 64, 0.12);
    }
    .cover-title {
      font-size: clamp(56px, 14vw, 84px);
      font-weight: 800;
      letter-spacing: 0.16em;
      color: #3E2C1F;
      line-height: 1.02;
    }
    .cover-sub {
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #4F3A2A;
      margin-top: 4px;
    }
    .cover-mode {
      font-size: 14px;
      letter-spacing: 0.22em;
      color: #7A6555;
      margin-top: 10px;
    }
    .cover-divider {
      width: 40px;
      height: 1px;
      background: #D8C9B5;
      margin: 30px auto 0;
    }
    #start-btn {
      margin-top: 30px;
      padding: 14px 46px;
      border: none;
      background: #6F543E;
      color: #F7F3EC;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2em;
      cursor: pointer;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(111, 84, 62, 0.28);
      transition: all 0.2s ease;
    }
    #start-btn:hover { background: #4F3A2A; }
    #start-btn:active { opacity: 0.85; }

    /* 游戏页 */
    #game-screen {
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }
    .stage-card {
      width: 100%;
      max-width: 480px;
      background: #FBF8F2;
      border: 1px solid #EFE6D4;
      border-radius: 24px;
      padding: 18px 16px 14px;
      margin: 10px 14px 0;
      box-shadow: 0 10px 24px rgba(120, 91, 64, 0.08);
    }
    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .stage-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: #3E2C1F;
    }
    .stage-mode {
      font-size: 11px;
      color: #4F3A2A;
      background: #EDE6DA;
      border: 1px solid #E7DDCB;
      border-radius: 999px;
      padding: 4px 10px;
      letter-spacing: 0.12em;
    }
    .progress-track {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .progress-line {
      flex: 1;
      height: 4px;
      background: #EDE6DA;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #C9A98A, #6F543E);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 11px;
      color: #7A6555;
      letter-spacing: 0.1em;
    }
    #instruction {
      margin: 16px 14px 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: #4F3A2A;
      background: #F7F3EC;
      border: 1px solid #E7DDCB;
      border-radius: 16px;
      padding: 11px 14px;
      max-width: 480px;
      width: calc(100% - 28px);
    }
    #group-container {
      width: 100%;
      max-width: 480px;
      display: grid;
      gap: 12px;
      align-items: stretch;
      padding: 0 14px;
    }
    .group-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .group-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .group-grid-2v2 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    /* 终极二选一大卡片：直角图片框 */
    .group-compare {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 8px 14px;
    }
    .compare-card {
      position: relative;
      overflow: hidden;
      background: #EDE6DA;
      cursor: pointer;
      aspect-ratio: 3/4;
      border-radius: 0;
      border: 1px solid #E7DDCB;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
      box-shadow: 0 10px 24px rgba(120, 91, 64, 0.1);
    }
    .compare-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border: 3px solid #D8C9B5;
      border-radius: 0;
    }
    .compare-card .character-name {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      right: auto;
      bottom: 8px;
      padding: 3px 8px;
      color: #4F3A2A;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
      background: rgba(251, 248, 242, 0.9);
      border: 1px solid #E7DDCB;
      border-radius: 6px;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: calc(100% - 16px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .compare-card.selected { transform: scale(1.02); }
    .compare-card.eliminated {
      opacity: 0.18;
      filter: grayscale(1);
      transform: scale(0.97);
    }

    /* 普通游戏卡片：直角图片框 */
    .character-card {
      position: relative;
      overflow: hidden;
      background: #EDE6DA;
      cursor: pointer;
      aspect-ratio: 3/4;
      border-radius: 0;
      border: 1px solid #E7DDCB;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
      box-shadow: 0 10px 24px rgba(120, 91, 64, 0.1);
    }
    .character-card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border: 3px solid #D8C9B5;
      border-radius: 0;
    }
    .character-name {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      right: auto;
      bottom: 8px;
      padding: 3px 8px;
      color: #4F3A2A;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-align: center;
      background: rgba(251, 248, 242, 0.9);
      border: 1px solid #E7DDCB;
      border-radius: 6px;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      max-width: calc(100% - 16px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .character-card.selected { transform: scale(1.02); }
    .character-card.eliminated {
      opacity: 0.18;
      filter: grayscale(1);
      transform: scale(0.97);
    }

    /* 结果页 */
    #result-screen {
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      padding-bottom: 50px;
    }
    .result-title {
      text-align: center;
      margin-bottom: 10px;
    }
    .result-prefix {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 0.1em;
      margin-bottom: 3px;
      color: #3E2C1F;
    }
    .result-cn {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #3E2C1F;
    }
    .result-jp {
      margin-top: 5px;
      font-size: 14px;
      letter-spacing: 0.18em;
      color: #7A6555;
    }
    #result-grid {

      max-width: 480px;
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 0 14px;
    }
    .result-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3/4;
      background: #EDE6DA;
      border-radius: 0;
      border: 1px solid #E7DDCB;
      box-shadow: 0 10px 24px rgba(120, 91, 64, 0.1);

      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border: 3px solid #D8C9B5;
      border-radius: 0;
    }
    .result-rank-wrap {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      width: 24px;
      height: 24px;
      border-radius: 0;

      border: 1px solid #E7DDCB;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result-rank-inner {
      font-size: 12px;
      font-weight: 900;
      color: #4F3A2A;
    }
    .result-name {

      left: 50%;
      transform: translateX(-50%);
      right: auto;
      bottom: 8px;
      padding: 3px 8px;

    #again-btn {

      border: none;
      background: #6F543E;

    #again-btn:active { opacity: 0.85; }

    /* 手机适配 */
    @media (max-width: 600px) {
      .game-bar { padding: 12px 14px 8px; }
      #start-screen { padding-top: 14px; }
      .cover-card { padding: 36px 16px; }
      #game-screen { padding-bottom: 30px; }
      .stage-card { padding: 14px 12px 12px; }
      #group-container { gap: 8px; }
      .character-name { font-size: 9px; padding: 2px 6px; }
      #instruction { margin: 14px 12px 10px; font-size: 12px; }
      #result-grid { gap: 7px; }
      .result-rank-wrap {
        width: 20px;
        height: 20px;
        top: 8px;
        left: 8px;
      }
      .result-rank-inner { font-size: 11px; }
      .result-name { font-size: 9px; padding: 2px 6px; }
    }

    .site-watermark {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 10px;
      text-align: center;
      font-size: 12px;
      color: #5F4A38;
      opacity: 0.55;
      letter-spacing: 2px;
      pointer-events: none;
      user-select: none;
      z-index: 9999;

    { name: "李彦", img: "./微信图片_20261005032821_152_35.jpg" },
    { name: "程雷", img: "./微信图片_20261005032824_153_35.jpg" },
    { name: "孙志军", img: "./微信图片_20261005032825_154_35.jpg" },
    { name: "路远", img: "./微信图片_20261005032826_155_35.jpg" },
    { name: "赵磊", img: "./微信图片_20261005032834_156_35.jpg" },
    { name: "地瓜", img: "./微信图片_20261005032835_157_35.jpg" },
    { name: "孙诺", img: "./微信图片_20261005032836_158_35.jpg" },
    { name: "冬子", img: "./微信图片_20261005032837_159_35.jpg" },
    { name: "赵鞅", img: "./微信图片_20261005032838_160_35.jpg" }
  ];

  const characters = characterData.map(item => ({ name: item.name, img: item.img }));
  const startScreen    = document.getElementById("start-screen");
  const gameScreen     = document.getElementById("game-screen");
  const resultScreen   = document.getElementById("result-screen");
  const startBtn       = document.getElementById("start-btn");
  const againBtn       = document.getElementById("again-btn");
  const roundTitle     = document.getElementById("round-title");
  const roundSubtitle  = document.getElementById("round-subtitle");
  const roundTag       = document.getElementById("round-tag");
  const instruction    = document.getElementById("instruction");
  const groupContainer = document.getElementById("group-container");
  const resultGrid     = document.getElementById("result-grid");
  const progressFill   = document.getElementById("progress-fill");
  const progressText   = document.getElementById("progress-text");

  let players = [];
  let winners = [];
  let currentGroups = [];
  let currentGroupIndex = 0;
  let locked = false;
  let pickCount = {};

  // 终极票选轮变量
  let finalPool = [];
  let finalMatches = [];
  let finalMatchIndex = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function showScreen(screen) {
    startScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    resultScreen.classList.remove("active");
    screen.classList.add("active");
  }

  startBtn.addEventListener("click", startGame);
  againBtn.addEventListener("click", () => {
    showScreen(startScreen);
  });

  function startGame() {
    players = shuffle(characters);
    winners = [];
    currentGroups = [];
    currentGroupIndex = 0;
    pickCount = {};
    locked = false;
    showScreen(gameScreen);
    startRound1();
  }

  // 修复：用requestAnimationFrame等待页面渲染完毕再设置进度条宽度，解决偶尔不显示问题
  function updateGameProgress() {
    const total = currentGroups.length;
    const current = currentGroupIndex + 1;
    const percent = total === 0 ? 0 : Math.round((current / total) * 100);
    requestAnimationFrame(()=>{
      progressFill.style.width = percent + "%";
      progressText.textContent = current + " / " + total;
    });
  }

  function startRound1() {
    roundTitle.textContent = "第一轮";
    roundSubtitle.textContent = "4选2";
    roundTag.textContent = "第一轮";
    instruction.textContent = "请在每组中选择两张骁";
    winners = [];
    currentGroups = [];
    let index = 0;
    while (index + 4 <= players.length) {
      currentGroups.push(players.slice(index, index + 4));
      index += 4;
    }
    const remaining = players.slice(index);
    if (remaining.length > 0) currentGroups.push(remaining);
    currentGroupIndex = 0;
    showCurrentGroup();
  }

  function startRound2() {
    players = shuffle(winners);
    winners = [];
    currentGroups = [];
    let index = 0;
    while (index < players.length) {
      currentGroups.push(players.slice(index, index + 3));
      index += 3;
    }
    currentGroupIndex = 0;
    roundTitle.textContent = "第二轮";
    roundSubtitle.textContent = "3选2";
    roundTag.textContent = "第二轮";
    instruction.textContent = "请在每组中选择两张骁";
    showCurrentGroup();
  }

  function startRound3() {
    players = shuffle(winners);
    winners = [];
    currentGroups = [];
    for (let i = 0; i + 4 <= players.length; i += 4) {
      currentGroups.push(players.slice(i, i + 4));
    }
    currentGroupIndex = 0;
    roundTitle.textContent = "第三轮";
    roundSubtitle.textContent = "4选2";
    roundTag.textContent = "第三轮";
    instruction.textContent = "请在每组中选择两张骁";
    showCurrentGroup();
  }

  function showCurrentGroup() {
    groupContainer.innerHTML = "";
    locked = false;
    const group = currentGroups[currentGroupIndex];
    if (!group || group.length === 0) { finishCurrentRound(); return; }
    const size = group.length;
    if (size === 4) groupContainer.className = "group-grid-4";
    else if (size === 3) groupContainer.className = "group-grid-3";
    else groupContainer.className = "group-grid-2v2";
    group.forEach(ch => groupContainer.appendChild(createCard(ch)));
    updateGameProgress();
  }

  function placeholderSrc(name) {
    return "https://placehold.co/400x533/f0c8d4/c2185b?text=" + encodeURIComponent(name);
  }

  function createCard(ch) {
    const card = document.createElement("div");
    card.className = "character-card";
    card.dataset.name = ch.name;
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = ch.img || placeholderSrc(ch.name);
    img.alt = ch.name;
    const name = document.createElement("div");
    name.className = "character-name";
    name.textContent = ch.name;
    card.appendChild(img);
    card.appendChild(name);
    card.addEventListener("click", () => { if (!locked) handleSelection(card, ch); });
    return card;
  }

  function createCompareCard(ch, callback) {
    const card = document.createElement("div");
    card.className = "compare-card";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = ch.img || placeholderSrc(ch.name);
    img.alt = ch.name;
    const name = document.createElement("div");
    name.className = "character-name";
    name.textContent = ch.name;
    card.appendChild(img);
    card.appendChild(name);
    card.addEventListener("click", () => { if (!locked) callback(ch); });
    return card;
  }

  function handleSelection(card, ch) {
    const group = currentGroups[currentGroupIndex];
    const required = group.length === 4 ? 2 : group.length === 3 ? 2 : 1;
    if (card.classList.contains("selected")) {
      card.classList.remove("selected");
      const selected = [...groupContainer.querySelectorAll(".selected")];
      if (selected.length < required) {
        groupContainer.querySelectorAll(".character-card").forEach(c => c.classList.remove("eliminated"));
      }
      return;
    }
    const selected = [...groupContainer.querySelectorAll(".selected")];
    if (selected.length >= required) return;
    card.classList.add("selected");
    const nowSelected = [...groupContainer.querySelectorAll(".selected")];
    if (nowSelected.length === required) {
      locked = true;
      groupContainer.querySelectorAll(".character-card").forEach(other => {
        if (!other.classList.contains("selected")) other.classList.add("eliminated");
      });
      setTimeout(() => {
        const selectedChars = [];
        nowSelected.forEach(sc => {
          const n = sc.dataset.name;
          const found = group.find(item => item.name === n);
          if (found) selectedChars.push(found);
        });
        selectedChars.forEach(c => { pickCount[c.name] = (pickCount[c.name] || 0) + 1; });
        winners.push(...selectedChars);
        currentGroupIndex++;
        if (currentGroupIndex < currentGroups.length) showCurrentGroup();
        else finishCurrentRound();
      }, 450);
    }
  }

  function finishCurrentRound() {
    if (roundTitle.textContent === "第一轮") startRound2();
    else if (roundTitle.textContent === "第二轮") startRound3();
    else if (roundTitle.textContent === "第三轮") startFinalRound();
  }

  // 终极票选轮：不淘汰任何人，两两配对二选一累计票数
  function startFinalRound() {
    finalPool = shuffle([...winners]);
    // 两两配对
    finalMatches = [];
    for (let i = 0; i + 1 < finalPool.length; i += 2) {
      finalMatches.push([finalPool[i], finalPool[i + 1]]);
    }
    // 奇数最后1人轮空，直接+2票
    if (finalPool.length % 2 === 1) {
      const last = finalPool[finalPool.length - 1];
      pickCount[last.name] = (pickCount[last.name] || 0) + 2;
    }
    finalMatchIndex = 0;
    roundTitle.textContent = "第四轮";
    roundSubtitle.textContent = "2选1";
    roundTag.textContent = "终局";
    instruction.textContent = "激动人心的终极时刻";
    document.getElementById("progress-fill").parentNode.parentNode.style.display = "none";
    showFinalMatch();
  }

  function showFinalMatch() {
    groupContainer.innerHTML = "";
    groupContainer.className = "group-compare";
    locked = false;
    if (finalMatchIndex >= finalMatches.length) {
      // 全部候选按票数降序排列
      const fullSorted = [...finalPool].sort((a, b) => (pickCount[b.name] || 0) - (pickCount[a.name] || 0));
      // 取出票数前9名
      let top9 = fullSorted.slice(0, 9);
      // 前5名强制严格按票数从高到低
      const top5 = top9.slice(0, 5).sort((a, b) => (pickCount[b.name] || 0) - (pickCount[a.name] || 0));
      // 6~9名保留原顺序，允许平票，不重新排序
      const rest4 = top9.slice(5);
      // 合并结果
      top9 = [...top5, ...rest4];
      showFinalResult(top9);
      return;
    }
    const [a, b] = finalMatches[finalMatchIndex];
    const cardA = createCompareCard(a, (ch) => handleFinalPick(ch));
    const cardB = createCompareCard(b, (ch) => handleFinalPick(ch));
    groupContainer.appendChild(cardA);
    groupContainer.appendChild(cardB);
  }

  function handleFinalPick(winner) {
    locked = true;
    pickCount[winner.name] = (pickCount[winner.name] || 0) + 2;
    const cards = groupContainer.querySelectorAll(".compare-card");
    cards.forEach(c => {
      if (c.querySelector(".character-name").textContent === winner.name) c.classList.add("selected");
      else c.classList.add("eliminated");
    });
    setTimeout(() => {
      finalMatchIndex++;
      showFinalMatch();
    }, 400);
  }

  function showFinalResult(top9Raw) {
    showScreen(resultScreen);
    resultGrid.innerHTML = "";
    top9Raw.forEach((ch, i) => {
      const card = document.createElement("div");
      card.className = "result-card";

      const img = document.createElement("img");
      img.src = ch.img || placeholderSrc(ch.name);
      img.alt = ch.name;

      // 排名数字使用直角标签
      const rankWrap = document.createElement("div");
      rankWrap.className = "result-rank-wrap";
      const rankInner = document.createElement("div");
      rankInner.className = "result-rank-inner";
      rankInner.textContent = i + 1;
      rankWrap.appendChild(rankInner);

      const name = document.createElement("div");
      name.className = "result-name";
      name.textContent = ch.name;

      card.appendChild(img);
      card.appendChild(rankWrap);
      card.appendChild(name);
      resultGrid.appendChild(card);
    });
  }
  </script>
</body>
</html>
