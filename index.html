<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王骁颜TOP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; min-height: 100%;
      background: #fff0f3; color: #c2185b;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
    }
    body { min-height: 100vh; }
    .screen { display: none; width: 100%; min-height: 100vh; }
    .screen.active { display: flex; }
    /* 首页 */
    #start-screen { align-items: center; justify-content: center; text-align: center; }
    .start-content { width: 100%; padding: 30px; }
    .title-prefix { font-size: clamp(42px,12vw,76px); font-weight: 700; letter-spacing: 0.08em; margin-bottom: 4px; }
    .title-cn { font-size: clamp(28px,8vw,48px); font-weight: 700; letter-spacing: 0.08em; }
    .title-jp { margin-top: 8px; font-size: clamp(20px,5vw,30px); letter-spacing: 0.12em; font-weight: 400; }
    #start-btn, #again-btn {
      margin-top: 55px; padding: 14px 42px;
      border: 2px solid #c2185b; background: #fff; color: #c2185b;
      font-size: 15px; font-weight: 800; letter-spacing: 0.18em;
      cursor: pointer; border-radius: 999px; transition: all 0.2s ease;
    }
    #start-btn:hover, #again-btn:hover { background: #c2185b; color: #fff; }
    #start-btn:active, #again-btn:active { opacity: 0.8; }
    /* 游戏页 */
    #game-screen { flex-direction: column; align-items: center; padding: 24px 14px 40px; }
    .game-header { width: 100%; max-width: 900px; text-align: center; }
    #round-title { font-size: 25px; font-weight: 700; letter-spacing: 0.08em; }
    #round-subtitle { margin-top: 7px; min-height: 20px; font-size: 13px; color: #e06e9a; }
    #progress-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
    #progress-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0c8d4; transition: all 0.25s ease; }
    #progress-dots .dot.done { background: #c2185b; }
    #progress-dots .dot.current { background: #c2185b; transform: scale(1.4); }
    #instruction { margin-top: 25px; margin-bottom: 20px; font-size: 15px; font-weight: 600; text-align: center; }
    #group-container { width: 100%; max-width: 1000px; display: grid; gap: 14px; align-items: stretch; }
    .group-grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .group-grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .group-grid-2v2 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    /* 终极二选一大卡片 */
    .group-compare { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding: 10px 0; }
    .compare-card {
      position: relative; overflow: hidden; background: #ddd; cursor: pointer;
      aspect-ratio: 3/4; border-radius: 0; user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
    }
    .compare-card img { width: 100%; height: 100%; display: block; object-fit: cover; border: 3px solid #f4c6d4; border-radius: 0; }
    .compare-card .character-name {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 3px 4px 5px; color: #fff; font-size: 20px; font-weight: 900;
      letter-spacing: 1px; text-align: center;
      background: rgba(244,198,212,0.45); line-height: 1.15;
      display: flex; align-items: center; justify-content: center; min-height: 26px;
    }
    .compare-card.selected { transform: scale(1.02); }
    .compare-card.eliminated { opacity: 0.18; filter: grayscale(1); transform: scale(0.97); }
    /* 普通游戏卡片 */
    .character-card {
      position: relative; overflow: hidden; background: #ddd; cursor: pointer;
      aspect-ratio: 3/4; user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
    }
    .character-card img { width: 100%; height: 100%; display: block; object-fit: cover; border: 3px solid #f4c6d4; border-radius: 0; }
    .character-name {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 3px 4px 5px; color: #fff; font-size: 18px; font-weight: 900;
      letter-spacing: 1px; text-align: center;
      background: rgba(244,198,212,0.45); line-height: 1.15;
      display: flex; align-items: center; justify-content: center; min-height: 24px;
    }
    .character-card.selected { transform: scale(1.02); }
    .character-card.eliminated { opacity: 0.18; filter: grayscale(1); transform: scale(0.97); }
    /* 结果页 */
    #result-screen { flex-direction: column; align-items: center; padding: 30px 14px 50px; }
    .result-title { text-align: center; }
    .result-prefix { font-size: 34px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 3px; }
    .result-cn { font-size: 24px; font-weight: 700; letter-spacing: 0.08em; }
    .result-jp { margin-top: 5px; font-size: 17px; letter-spacing: 0.12em; }
    #result-grid { width: 100%; max-width: 900px; margin-top: 35px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .result-card { position: relative; overflow: hidden; aspect-ratio: 3/4; background: #ddd; }
    .result-card img { width: 100%; height: 100%; display: block; object-fit: cover; border: 3px solid #f4c6d4; border-radius: 0; }
    .result-rank {
      position: absolute; top: 6px; left: 6px; z-index: 2;
      width: 22px; height: 22px; line-height: 22px; text-align: center;
      font-size: 13px; font-weight: 900; color: #c2185b; background: #ffd9e3; border-radius: 4px;
    }
    .result-name {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 3px 4px 5px; color: #fff; text-align: center;
      font-size: 18px; font-weight: 900; letter-spacing: 1px;
      background: rgba(244,198,212,0.45); line-height: 1.15;
      display: flex; align-items: center; justify-content: center; min-height: 24px;
    }
    .result-count {
      position: absolute; top: 8px; right: 9px; z-index: 2;
      font-size: 11px; color: #fff; text-shadow: 0 1px 3px rgba(194,24,91,0.6);
    }
    /* 手机适配 */
    @media (max-width: 600px) {
      #game-screen { padding: 18px 10px 30px; }
      #group-container { gap: 8px; }
      .character-name { font-size: 12px; padding: 2px 3px 4px; min-height: 18px; }
      #instruction { margin-top: 18px; margin-bottom: 14px; }
      #result-grid { gap: 7px; }
      .result-rank { width: 18px; height: 18px; line-height: 18px; font-size: 11px; top: 4px; left: 4px; }
      .result-name { font-size: 11px; padding: 2px 3px 4px; min-height: 16px; }
    }
    .site-watermark {
      position: fixed; left: 0; right: 0; bottom: 10px; text-align: center;
      font-size: 15px; color: #c2185b; opacity: 0.55; letter-spacing: 2px;
      pointer-events: none; user-select: none; z-index: 9999;
    }
  </style>
</head>

  const characters = characterData.map(item => ({ name: item.name, img: item.img }));
  const startScreen    = document.getElementById("start-screen");
  const gameScreen     = document.getElementById("game-screen");
  const resultScreen   = document.getElementById("result-screen");
  const startBtn       = document.getElementById("start-btn");
  const againBtn       = document.getElementById("again-btn");
  const roundTitle     = document.getElementById("round-title");
  const roundSubtitle  = document.getElementById("round-subtitle");
  const instruction    = document.getElementById("instruction");
  const groupContainer = document.getElementById("group-container");
  const resultGrid     = document.getElementById("result-grid");

  let players = [];
  let winners = [];
  let currentGroups = [];
  let currentGroupIndex = 0;
  let locked = false;
  let pickCount = {};

  // 终极票选轮变量
  let finalPool = [];
  let finalMatches = [];
  let finalMatchIndex = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function showScreen(screen) {
    startScreen.classList.remove("active");
    gameScreen.classList.remove("active");
    resultScreen.classList.remove("active");
    screen.classList.add("active");
  }

  startBtn.addEventListener("click", startGame);
  againBtn.addEventListener("click", ()=>{
    showScreen(startScreen);
  });

  function startGame() {
    players = shuffle(characters);
    winners = [];
    currentGroups = [];
    currentGroupIndex = 0;
    pickCount = {};
    locked = false;
    document.getElementById("progress-dots").style.display = "flex";
    showScreen(gameScreen);
    startRound1();
  }

  function startRound1() {
    roundTitle.textContent = "第一轮";
    roundSubtitle.textContent = "4选2";
    instruction.textContent = "请在每组中选择两张骁";
    winners = [];
    currentGroups = [];
    let index = 0;
    while (index + 4 <= players.length) {
      currentGroups.push(players.slice(index, index + 4));
      index += 4;
    }
    const remaining = players.slice(index);
    if (remaining.length > 0) currentGroups.push(remaining);
    currentGroupIndex = 0;
    showCurrentGroup();
  }

  function startRound2() {
    players = shuffle(winners);
    winners = [];
    currentGroups = [];
    let index = 0;
    while (index < players.length) {
      currentGroups.push(players.slice(index, index + 3));
      index += 3;
    }
    currentGroupIndex = 0;
    roundTitle.textContent = "第二轮";
    roundSubtitle.textContent = "3选2";
    instruction.textContent = "请在每组中选择两张骁";
    showCurrentGroup();
  }

  function startRound3() {
    players = shuffle(winners);
    winners = [];
    currentGroups = [];
    for (let i = 0; i + 4 <= players.length; i += 4) {
      currentGroups.push(players.slice(i, i + 4));
    }
    currentGroupIndex = 0;
    roundTitle.textContent = "第三轮";
    roundSubtitle.textContent = "4选2";
    instruction.textContent = "请在每组中选择两张骁";
    showCurrentGroup();
  }

  function showCurrentGroup() {
    groupContainer.innerHTML = "";
    locked = false;
    const group = currentGroups[currentGroupIndex];
    if (!group || group.length === 0) { finishCurrentRound(); return; }
    const size = group.length;
    if (size === 4) groupContainer.className = "group-grid-4";
    else if (size === 3) groupContainer.className = "group-grid-3";
    else groupContainer.className = "group-grid-2v2";
    group.forEach(ch => groupContainer.appendChild(createCard(ch)));
    updateProgress();
  }

  function placeholderSrc(name) {
    return "https://placehold.co/400x533/f0c8d4/c2185b?text=" + encodeURIComponent(name);
  }

  function createCard(ch) {
    const card = document.createElement("div");
    card.className = "character-card";
    card.dataset.name = ch.name;
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = ch.img || placeholderSrc(ch.name);
    img.alt = ch.name;
    const name = document.createElement("div");
    name.className = "character-name";
    name.textContent = ch.name;
    card.appendChild(img);
    card.appendChild(name);
    card.addEventListener("click", () => { if (!locked) handleSelection(card, ch); });
    return card;
  }

  function createCompareCard(ch, callback) {
    const card = document.createElement("div");
    card.className = "compare-card";
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = ch.img || placeholderSrc(ch.name);
    img.alt = ch.name;
    const name = document.createElement("div");
    name.className = "character-name";
    name.textContent = ch.name;
    card.appendChild(img);
    card.appendChild(name);
    card.addEventListener("click", ()=>{ if(!locked) callback(ch); });
    return card;
  }

  function handleSelection(card, ch) {
    const group = currentGroups[currentGroupIndex];
    const required = group.length === 4 ? 2 : group.length === 3 ? 2 : 1;
    if (card.classList.contains("selected")) {
      card.classList.remove("selected");
      const selected = [...groupContainer.querySelectorAll(".selected")];
      if (selected.length < required) {
        groupContainer.querySelectorAll(".character-card").forEach(c => c.classList.remove("eliminated"));
      }
      return;
    }
    const selected = [...groupContainer.querySelectorAll(".selected")];
    if (selected.length >= required) return;
    card.classList.add("selected");
    const nowSelected = [...groupContainer.querySelectorAll(".selected")];
    if (nowSelected.length === required) {
      locked = true;
      groupContainer.querySelectorAll(".character-card").forEach(other => {
        if (!other.classList.contains("selected")) other.classList.add("eliminated");
      });
      setTimeout(() => {
        const selectedChars = [];
        nowSelected.forEach(sc => {
          const n = sc.dataset.name;
          const found = group.find(item => item.name === n);
          if (found) selectedChars.push(found);
        });
        selectedChars.forEach(c => { pickCount[c.name] = (pickCount[c.name] || 0) + 1; });
        winners.push(...selectedChars);
        currentGroupIndex++;
        if (currentGroupIndex < currentGroups.length) showCurrentGroup();
        else finishCurrentRound();
      }, 450);
    }
  }

  function finishCurrentRound() {
    if (roundTitle.textContent === "第一轮") startRound2();
    else if (roundTitle.textContent === "第二轮") startRound3();
    else if (roundTitle.textContent === "第三轮") startFinalRound();
  }

  // 终极票选轮：不淘汰任何人，两两配对二选一累计票数
  // 【方案A】终极PK获胜 +2票，奇数轮空也 +2票
  function startFinalRound() {
    finalPool = shuffle([...winners]);
    // 两两配对
    finalMatches = [];
    for (let i = 0; i + 1 < finalPool.length; i += 2) {
      finalMatches.push([finalPool[i], finalPool[i+1]]);
    }
    // 奇数最后1人轮空，直接+2票
    if (finalPool.length % 2 === 1) {
      const last = finalPool[finalPool.length - 1];
      pickCount[last.name] = (pickCount[last.name] || 0) + 2;
    }
    finalMatchIndex = 0;
    roundTitle.textContent = "终极票选";
    roundSubtitle.textContent = "点击更喜欢的角色，累计票数";
    instruction.textContent = "每组二选一，最终按票数排序选出TOP9";
    document.getElementById("progress-dots").style.display = "none";
    showFinalMatch();
  }

  function showFinalMatch() {
    groupContainer.innerHTML = "";
    groupContainer.className = "group-compare";
    locked = false;
    if (finalMatchIndex >= finalMatches.length) {
      // 全部候选按票数降序排列
      const fullSorted = [...finalPool].sort((a,b)=> (pickCount[b.name]||0) - (pickCount[a.name]||0));
      // 取出票数前9名
      let top9 = fullSorted.slice(0,9);
      // 前5名强制严格按票数从高到低
      const top5 = top9.slice(0,5).sort((a,b)=> (pickCount[b.name]||0) - (pickCount[a.name]||0));
      // 6~9名保留原顺序，允许平票，不重新排序
      const rest4 = top9.slice(5);
      // 合并结果
      top9 = [...top5, ...rest4];
      showFinalResult(top9);
      return;
    }
    const [a, b] = finalMatches[finalMatchIndex];
    const cardA = createCompareCard(a, (ch)=>handleFinalPick(ch));
    const cardB = createCompareCard(b, (ch)=>handleFinalPick(ch));
    groupContainer.appendChild(cardA);
    groupContainer.appendChild(cardB);
  }

  function handleFinalPick(winner) {
    locked = true;
    // 【方案A】终极PK获胜 +2票
    pickCount[winner.name] = (pickCount[winner.name]||0) + 2;
    const cards = groupContainer.querySelectorAll(".compare-card");
    cards.forEach(c=>{
      if (c.querySelector(".character-name").textContent === winner.name) c.classList.add("selected");
      else c.classList.add("eliminated");
    });
    setTimeout(()=>{
      finalMatchIndex++;
      showFinalMatch();
    }, 400);
  }

  function showFinalResult(top9Raw) {
    showScreen(resultScreen);
    resultGrid.innerHTML = "";
    top9Raw.forEach((ch, i) => {
      const card = document.createElement("div");
      card.className = "result-card";
      const img = document.createElement("img");
      img.src = ch.img || placeholderSrc(ch.name);
      img.alt = ch.name;
      const rank = document.createElement("div");
      rank.className = "result-rank";
      rank.textContent = i + 1;
      const name = document.createElement("div");
      name.className = "result-name";
      name.textContent = ch.name;
      const count = document.createElement("div");
      count.className = "result-count";
      count.textContent = (pickCount[ch.name] || 0) + "次";
      card.appendChild(img);
      card.appendChild(rank);
      card.appendChild(count);
      card.appendChild(name);
      resultGrid.appendChild(card);
    });
  }

  function updateProgress() {
    const dotsContainer = document.getElementById("progress-dots");
    const total = currentGroups.length;
    const current = currentGroupIndex;
    dotsContainer.innerHTML = "";
    for (let i = 0; i < total; i++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      if (i < current) dot.classList.add("done");
      else if (i === current) dot.classList.add("current");
      dotsContainer.appendChild(dot);
    }
  }
  </script>
</body>
</html>
